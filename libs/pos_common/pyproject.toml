[project]
name = "pos-common"
version = "0.1.0"
description = "Shared config, DB access, auth, and model definitions for pos_seller_web microservices"
requires-python = ">=3.11"
dependencies = [
    "sqlmodel==0.0.24",
    "pymysql==1.1.1",
    "pyjwt==2.10.1",
    "python-dotenv==1.1.0",
    "fastapi==0.115.12",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pos_common*"]
