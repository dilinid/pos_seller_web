# pos_seller_web API gateway.
#
# Unifies every backend service behind one origin so the frontend (which already
# calls relative "/api/..." paths — see frontend/vite.config.ts's dev proxy and
# frontend/src/apis/*.api.ts's VITE_API_BASE_URL default of "/api") needs zero
# code changes as services are peeled out of the monolith one at a time.
#
# /internal/* is intentionally NEVER routed here — those endpoints (e.g. Picking
# calling Ordering's /internal/orders/*) are reached only via Docker-network
# container DNS, service-to-service, and must stay unreachable from the browser.
#
# Nginx location specificity note: more specific prefixes (^~) are listed BEFORE
# their broader catch-all siblings, e.g. /api/marketplace/orders before
# /api/marketplace, since they're literal sub-paths owned by a different service.
#
# Migration state: Phase 1 complete — ordering_upstream, picking_upstream, and
# packing_upstream each point at their own standalone service; core_upstream
# remains the residual monolith (auth, location, marketplace catalog, staff).

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    upstream packing_upstream {
        server packing:8000;
    }

    upstream picking_upstream {
        server picking:8000;
    }

    upstream ordering_upstream {
        server ordering:8000;
    }

    upstream core_upstream {
        server core:8000;
    }

    server {
        listen 80;

        client_max_body_size 20m;

        # Ordering service routes — carved out of /api/marketplace ahead of the
        # catch-all marketplace block below.
        location ^~ /api/marketplace/seller/orders {
            proxy_pass http://ordering_upstream;
            include /etc/nginx/proxy_params.conf;
        }

        location ^~ /api/marketplace/orders {
            proxy_pass http://ordering_upstream;
            include /etc/nginx/proxy_params.conf;
        }

        # Picking service.
        location ^~ /api/seller/pickup-list {
            proxy_pass http://picking_upstream;
            include /etc/nginx/proxy_params.conf;
        }

        # Packing service.
        location ^~ /api/seller/packing-list {
            proxy_pass http://packing_upstream;
            include /etc/nginx/proxy_params.conf;
        }

        location ^~ /api/seller/package-types {
            proxy_pass http://packing_upstream;
            include /etc/nginx/proxy_params.conf;
        }

        # Everything else — auth, location, marketplace catalog, staff — stays on
        # Core through all of Phase 1.
        location /api/ {
            proxy_pass http://core_upstream;
            include /etc/nginx/proxy_params.conf;
        }

        location /oauth/ {
            proxy_pass http://core_upstream;
            include /etc/nginx/proxy_params.conf;
        }

        location /uploads/ {
            proxy_pass http://core_upstream;
            include /etc/nginx/proxy_params.conf;
        }

        location = /gateway/health {
            return 200 '{"status":"ok"}';
            add_header Content-Type application/json;
        }

        # Explicit catch-all: anything not matched above (notably /internal/*)
        # gets a deterministic 404 instead of relying on nginx's implicit
        # unmatched-request handling. /internal/* must never be reachable here.
        location / {
            return 404;
        }
    }
}
